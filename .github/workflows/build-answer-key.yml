name: Build complete answer key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-answer-key.yml'
      - 'scripts/build-question-answer-key.mjs'

permissions:
  contents: write

jobs:
  build-key:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build all legacy answer keys
        run: node scripts/build-question-answer-key.mjs
      - name: Verify complete legacy key
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -Ec '^  "(math|biology|chemistry|physics)-[0-9]{3}": "[A-E]",?$' app/question-bank-answer-key.ts)
          test "$count" -eq 1000
          echo "Verified $count/1000 legacy answers"
      - name: Commit generated answer key
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/question-bank-answer-key.ts; then
            echo "Answer key already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/question-bank-answer-key.ts
          git commit -m 'Gera gabarito completo das 1000 questões antigas'
          git push
